<svg xmlns="http://www.w3.org/2000/svg" width="680" height="980" viewBox="0 0 680 980" font-family="Segoe UI, Arial, sans-serif">
<title>Lead tier routing - system architecture</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.th{font-size:14px;font-weight:500}.ts{font-size:12px}
.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .th{fill:#444441}.gray .ts{fill:#5F5E5A}
.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .th{fill:#085041}.teal .ts{fill:#0F6E56}
.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .th{fill:#3C3489}.purple .ts{fill:#534AB7}
.legend{font-size:12px;fill:#5F5E5A}</style></defs>
<rect width="680" height="980" fill="#FFFFFF"/>
<g class="gray"><rect x="190" y="30" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">New lead signs up</text><text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">Declared GBV, employees, domain</text></g>
<g class="purple"><rect x="190" y="120" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="138" text-anchor="middle" dominant-baseline="central">Tier rules + signup flags</text><text class="ts" x="340" y="158" text-anchor="middle" dominant-baseline="central">What needs research</text></g>
<g class="teal"><rect x="110" y="210" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="228" text-anchor="middle" dominant-baseline="central">Website reader</text><text class="ts" x="220" y="248" text-anchor="middle" dominant-baseline="central">Company's own pages</text></g>
<g class="teal"><rect x="350" y="210" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="460" y="228" text-anchor="middle" dominant-baseline="central">Search agent</text><text class="ts" x="460" y="248" text-anchor="middle" dominant-baseline="central">External sources</text></g>
<g class="teal"><rect x="190" y="300" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="318" text-anchor="middle" dominant-baseline="central">Trust checks</text><text class="ts" x="340" y="338" text-anchor="middle" dominant-baseline="central">Right page · quote (code) · verifier</text></g>
<g class="gray"><rect x="190" y="390" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="408" text-anchor="middle" dominant-baseline="central">Evidence consolidation</text><text class="ts" x="340" y="428" text-anchor="middle" dominant-baseline="central">2 sources agree · conflicts</text></g>
<g class="purple"><rect x="110" y="480" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="220" y="498" text-anchor="middle" dominant-baseline="central">Decision rules</text><text class="ts" x="220" y="518" text-anchor="middle" dominant-baseline="central">Fixed thresholds</text></g>
<g class="teal"><rect x="350" y="480" width="220" height="56" rx="8" stroke-width="0.5"/><text class="th" x="460" y="498" text-anchor="middle" dominant-baseline="central">AI reviewer</text><text class="ts" x="460" y="518" text-anchor="middle" dominant-baseline="central">Judgment + priority</text></g>
<g class="gray"><rect x="190" y="570" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="588" text-anchor="middle" dominant-baseline="central">Combine</text><text class="ts" x="340" y="608" text-anchor="middle" dominant-baseline="central">Red only if both say red</text></g>
<g class="teal"><rect x="190" y="660" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="678" text-anchor="middle" dominant-baseline="central">Note for the sales team</text><text class="ts" x="340" y="698" text-anchor="middle" dominant-baseline="central">Numbers checked in code</text></g>
<g class="gray"><rect x="190" y="750" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="768" text-anchor="middle" dominant-baseline="central">Sales team decides</text><text class="ts" x="340" y="788" text-anchor="middle" dominant-baseline="central">The system only recommends</text></g>
<g class="purple"><rect x="190" y="840" width="300" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="858" text-anchor="middle" dominant-baseline="central">Day-30 review</text><text class="ts" x="340" y="878" text-anchor="middle" dominant-baseline="central">Actual bookings · trend</text></g>
<line x1="340" y1="86" x2="340" y2="118" class="arr" marker-end="url(#arrow)"/>
