<path d="M340 462 L460 462 L460 478" class="arr" marker-end="url(#arrow)"/>
<path d="M220 536 L220 552 L340 552 L340 568" class="arr" marker-end="url(#arrow)"/>
<path d="M460 536 L460 552 L340 552" class="arr"/>
<line x1="340" y1="626" x2="340" y2="658" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="716" x2="340" y2="748" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="806" x2="340" y2="838" class="arr" marker-end="url(#arrow)"/>
